{% extends "base.html" %}
{% block title %}Register | Expense Tracker{% endblock %}
{% block content %}
<h1>Register</h1>
<section class="narrow">
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="form-actions"><button type="submit">Register</button></div>

    <p class="form-footnote">Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
</section>
{% endblock %}
