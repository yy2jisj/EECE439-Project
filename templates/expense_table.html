{% load humanize %}
<div class="table-wrap">
<table>
    <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead>
    <tbody>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.date|date:"d M Y" }}</td>
            <td>{{ expense.description }}</td>
            <td>{{ expense.get_category_display }}</td>
            <td>{{ expense.currency }} {{ expense.amount|floatformat:2|intcomma }}</td>
            <td><a href="{% url 'expense_edit' expense.pk %}">Edit</a> <a href="{% url 'expense_delete' expense.pk %}">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
