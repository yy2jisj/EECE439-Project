{% extends "base.html" %}
{% block title %}Login | Expense Tracker{% endblock %}
{% block content %}
<h1>Login</h1>
<section class="auth-form">
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="form-actions"><button type="submit">Login</button></div>
    </form>
    <p class="form-footnote">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
